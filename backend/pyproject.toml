[project]
name = "choir-evaluation-backend"
version = "0.1.0"
description = "Choir Member Evaluation System: Django modular-monolith backend"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff: lint + format (ADR-007)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "DJ",       # django
  "S",        # bandit (security)
  "SIM",      # simplify
  "C4",       # comprehensions
  "PT",       # pytest style
  "DTZ",      # naive datetimes
  "RUF",
]
ignore = [
  "RUF012",   # Django/DRF class attributes (permission_classes, Meta.fields) are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "E402"]
"config/settings/test.py" = ["S105"]
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S106"]
"apps/core/testing/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "-ra --strict-markers"
